name: Native relinker

on:
  push:
    branches: [relink/native-agc-only]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-relink-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Preserve source for reproducible diagnosis
        run: tar --exclude=.git --exclude=build -czf "$RUNNER_TEMP/native-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: native-source
          path: ${{ runner.temp }}/native-source.tar.gz
          retention-days: 2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14 libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libasound2-dev libvulkan-dev mesa-vulkan-drivers
      - name: Configure native mode
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DAGC_NATIVE_RELINKED_ONLY=ON
      - name: Build relinker and native libraries
        run: cmake --build build --parallel 2 --target relinker libSceAgcDriver libSceAgc libSceVideoOut
      - name: Run registered tests
        run: |
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Verify native driver excludes legacy command execution
        shell: bash
        run: |
          set -eu
          driver=$(find build -type f -name 'libSceAgcDriver.prx' -print -quit)
          test -n "$driver"
          if nm -C "$driver" | grep -E 'AgcDriver::Pm4::(Execute|ResolveDraw|ResolveValidatedDraw)|AgcDriver::Graphics::Decode(State|DepthState)'; then
            echo 'Legacy command execution linked into native driver' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-build-diagnostics
          path: |
            build/CMakeCache.txt
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
